<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Built by Stephen — Thumbnail</title>
<link rel="stylesheet" href="styles.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 150px;width:1280px;height:854px}
.mark{display:flex;align-items:center;justify-content:center;background:#04ffb2;padding:0 80px}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip span{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div class="tile">
  <div class="mark">
    <span class="bbs-lockup bbs-lockup--stacked bbs-lockup--mono" style="--bbs-lockup-size:148px;color:#08231b">
      <i class="lk-builtby"></i>
      <span class="lk-row"><i class="lk-heart"></i><i class="lk-stephen"></i></span>
    </span>
  </div>
  <div class="strip">
    <span style="background:#00ffff"></span>
    <span style="background:#ff0080"></span>
    <span style="background:#8000ff"></span>
    <span style="background:#120227"></span>
  </div>
</div>
</body></html>
